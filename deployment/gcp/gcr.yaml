apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: golang-threat-generator
  generation: 12
  labels:
    run.googleapis.com/satisfiesPzs: 'true'
    cloud.googleapis.com/location: southamerica-east1
  annotations:
    serving.knative.dev/creator: igoreulalio.ie@gmail.com
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
spec:
  template:
    metadata:
      labels:
        run.googleapis.com/startupProbeType: Custom
      annotations:
        autoscaling.knative.dev/maxScale: '100'
        run.googleapis.com/client-name: cloud-console
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: 163839575370-compute@developer.gserviceaccount.com
      containers:
        - name: image-1
          image: southamerica-east1-docker.pkg.dev/thinking-heaven-421211/golang-event-generator/instrumented:v2@sha256:94df2b275d8f96366f61fbddf98aa406577b422691fd570a91476794233f65fb
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SYSDIG_COLLECTOR
              value: ingest.us4.sysdig.com
            - name: SYSDIG_ACCESS_KEY
              value: $access_key
            - name: SYSDIG_ENABLE_LOG_FORWARD
              value: 'false'
            - name: SYSDIG_WORKLOAD_ID
              value: release-book-app
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 10
            tcpSocket:
              port: 8080
  traffic:
    - percent: 100
      latestRevision: true
